{% extends "base.html" %}
{% block title %}Sign in — Modelbay{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web.sign_in') }}">
  <input type="hidden" name="next" value="{{ next }}">
  <p><input type="text" name="username" placeholder="Username" autofocus></p>
  <p><input type="password" name="secret" placeholder="Secret"></p>
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
