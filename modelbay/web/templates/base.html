<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Modelbay{% endblock %}</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; color: #1c1c1e; }
    nav { background: #24292f; padding: 10px 20px; }
    nav a { color: #fff; text-decoration: none; margin-right: 16px; }
    nav a.brand { font-weight: 700; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d0d7de; padding: 6px 10px; text-align: left; }
    input[type=text], input[type=password] { padding: 6px; width: 280px; }
    button { padding: 6px 14px; }
    .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin: 12px 0; }
    .answer { background: #f6f8fa; border-radius: 6px; padding: 12px; white-space: pre-wrap; }
    .error { color: #cf222e; }
    .notice { color: #1a7f37; }
    mark { background: #fff8c5; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('web.home') }}">Modelbay</a>
  {% if portal_account %}
    <a href="{{ url_for('web.bundle_list') }}">Bundles</a>
    <a href="{{ url_for('web.find') }}">Find</a>
    <a href="{{ url_for('web.chat') }}">Assistant</a>
    {% if portal_account.tier == 'admin' %}<a href="{{ url_for('web.console') }}">Console</a>{% endif %}
    <a href="{{ url_for('web.sign_out') }}">Sign out ({{ portal_account.username }})</a>
  {% else %}
    <a href="{{ url_for('web.sign_in') }}">Sign in</a>
  {% endif %}
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script>
// The portal's JS widgets call the JSON API with the same session token the
// pages use, read straight from the cookie.
function portalToken() {
  const row = document.cookie.split("; ").find(r => r.startsWith("portal_session="));
  return row ? decodeURIComponent(row.split("=")[1]) : null;
}
function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({"Authorization": "Bearer " + portalToken()},
                               opts.headers || {});
  return fetch(path, opts);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
