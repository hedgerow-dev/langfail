{% extends "base.html" %}
{% block title %}Sign in · Larchway{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/studio/sign-in">
  <input type="hidden" name="after" value="{{ after }}">
  <p><label>Handle <input type="text" name="handle" autofocus></label></p>
  <p><label>Passphrase <input type="password" name="passphrase"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
