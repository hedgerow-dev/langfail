<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Langfail{% endblock %}</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; color: #1c1c1e; }
    nav { background: #24292f; padding: 10px 20px; }
    nav a { color: #fff; text-decoration: none; margin-right: 16px; }
    nav a.brand { font-weight: 700; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d0d7de; padding: 6px 10px; text-align: left; }
    input[type=text], input[type=password] { padding: 6px; width: 280px; }
    button { padding: 6px 14px; }
    .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin: 12px 0; }
    .answer { background: #f6f8fa; border-radius: 6px; padding: 12px; white-space: pre-wrap; }
    .error { color: #cf222e; }
    .notice { color: #1a7f37; }
    mark { background: #fff8c5; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('ui.index') }}">Langfail</a>
  {% if session_user %}
    <a href="{{ url_for('ui.models') }}">Models</a>
    <a href="{{ url_for('ui.search') }}">Search</a>
    <a href="{{ url_for('ui.chat') }}">Assistant</a>
    {% if session_user.role == 'admin' %}<a href="{{ url_for('ui.admin') }}">Admin</a>{% endif %}
    <a href="{{ url_for('ui.logout') }}">Log out ({{ session_user.username }})</a>
  {% else %}
    <a href="{{ url_for('ui.login') }}">Log in</a>
  {% endif %}
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script>
// The dashboard's JS widgets call the JSON API with the same session token
// the pages use, read straight from the cookie.
function sessionToken() {
  const row = document.cookie.split("; ").find(r => r.startsWith("session_token="));
  return row ? decodeURIComponent(row.split("=")[1]) : null;
}
function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({"Authorization": "Bearer " + sessionToken()},
                               opts.headers || {});
  return fetch(path, opts);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
