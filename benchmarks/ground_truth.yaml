  - id: V27
    title: Call-site-sensitive path traversal in custom report templates
    cwe: CWE-22
    huntr_analog: "arbitrary file read via a template/theme-file selector param"
    tier: 6
    exploitable: true
    source: {file: langfail/api/reports.py, symbol: custom_report, note: "template_name (JSON body)"}
    sink: {file: langfail/services/reports.py, symbol: load_template_file, line_hint: 35}
    taint_path:
      - langfail/api/reports.py:custom_report (data.template_name, passed only when present)
      - langfail/services/reports.py:render_custom_report (passthrough, no validation)
      - langfail/services/reports.py:load_template_file (os.path.join(TEMPLATE_DIR, template_name), no containment check)
    sanitizers_present: []
    notes: >
      load_template_file is called from TWO sites: render_builtin_report resolves
      the filename through the BUILTIN_KINDS dict (always one of two hardcoded
      literals, regardless of the caller-supplied `kind` string — see D06) and
      render_custom_report passes template_name straight through. A
      context/call-site-insensitive engine that summarises taint per-function
      rather than per-call-site will either miss this (having "seen" the safe
      literal call site and concluded the sink is fine) or flag both call sites
      indiscriminately (a false positive on D06). Reading a file containing
      Jinja syntax also gets rendered as a template, so this composes with an
      arbitrary-write primitive (e.g. V10) into SSTI/RCE.
    poc: tests/test_exploits_tier6.py::test_v27_custom_template_traversal

  - id: V28
    title: Taint-diluted command injection via split retention config
    cwe: CWE-78
    huntr_analog: "shell command built from two independently-supplied config fragments"
    tier: 6
    exploitable: true
    source:
      - {file: langfail/api/datasets.py, symbol: create_dataset, note: "cleanup_dir (request 1, persisted to Dataset.cleanup_dir)"}
      - {file: langfail/api/datasets.py, symbol: schedule_cleanup, note: "pattern (request 2, later & unrelated, persisted to Job.payload_json only)"}
    sink: {file: langfail/services/retention.py, symbol: purge, line_hint: 12}
