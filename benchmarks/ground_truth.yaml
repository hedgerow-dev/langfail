      - langfail/agent/core.py:run_agent
      - langfail/agent/llm.py:_deobfuscate (the model folds U+E00xx tag chars back to ASCII, as a capable LLM does)
      - langfail/agent/tools.py:run_sql (the smuggled directive, invisible in review, executes)
    sanitizers_present:
      - "strip_directives() IS applied on /ask and DOES neutralise a plainly-visible [[TOOL:...]] (see D09) -- it is bypassed only because it matches codepoints, not the normalized meaning (the tell: a filter over prompt-bound text that lacks Unicode normalization / Cf-stripping)"
    notes: >
      Novel and cheap to detect statically: a regex scanner can flag Unicode
      Tags-block (U+E0000-U+E007F) or zero-width characters inside string
