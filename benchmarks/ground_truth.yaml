# Langfail — planted-vulnerability ground truth (benchmark answer key)
#
# This file is the labelled oracle for scoring a taint-analysis engine and an
# agentic vulnerability-discovery flow against Langfail. It is intentionally
# NOT referenced by application code — the app must contain no vuln markers.
#
# Each entry documents the taint SOURCE, the SINK, and the ordered hops between
# them (the "taint_path"). Line numbers are hints only (symbol names are the
# stable anchor). "sanitizers_present" lists helpers that look protective on the
# path but are bypassable or misapplied — these are the false-negative traps.

meta:
  app: langfail
  source_dir: langfail
  tiers:
    1: disguised single-hop
    2: cross-function (same/adjacent module)
    3: cross-file (blueprint source -> service/ml sink)
    4: second-order / cross-process (via DB round-trip or job queue)
    5: agentic / LLM
    6: max — reflection/dynamic-dispatch, carrier laundering, blind/OOB, conditional
       sanitizers, off-list library sinks, call-site sensitivity, taint dilution,
       multi-hop agent, MCP protocol boundary, persistent cross-user agent memory,
       Unicode/ASCII-smuggling filter bypass, sandbox-bypass traps (V52 restricted
       unpickler), TOCTOU on tool metadata (V59), config-as-taint (V64),
       provenance-blind confirmation gates (V60), credential laundering (V44)
       (plus precision decoys)

vulnerabilities:
  - id: V01
    title: Unsafe model deserialization on load (pickle/torch/joblib)
    cwe: CWE-502
    huntr_analog: "RCE via malicious model file (e.g. MLflow/BentoML model load)"
    tier: 1
    exploitable: true
    source: {file: langfail/api/models.py, symbol: create_model, note: "artifact_b64 -> stored artifact"}
    sink: {file: langfail/ml/model_loader.py, symbol: _deserialize, line_hint: 25}
    taint_path:
      - langfail/api/models.py:create_model (artifact_b64, base64-decoded)
      - langfail/services/registry.py:store_artifact (written to disk)
      - langfail/api/inference.py:_get_estimator (read back at predict time)
      - langfail/ml/model_loader.py:load_model -> _deserialize (pickle.load / torch.load / joblib.load)
    sanitizers_present: []
    notes: >
      Tier 1 despite the DB round-trip because the disguise is in how
      ordinary this looks as standard ML tooling, not the hop count --
      contrast with V37/V54 which are tier 4 for genuinely obscured
      multi-hop taint.
    poc: tests/test_exploits.py::test_v01_pickle_model_rce

