    sink: {file: langfail/services/registry.py, symbol: read_raw, line_hint: 34}
    taint_path:
      - "langfail/api/agent.py:save_preferences ({\"security\": {\"strict_paths\": false}} merged verbatim, one merge_namespace per top-level key)"
      - langfail/core/settings.py:merge_namespace (lands in the 'security' namespace document)
      - langfail/core/settings.py:get (dotted key 'security.strict_paths' resolves into the namespace document)
      - langfail/api/models.py:raw_artifact (get_bool gate now False -> sanitize_path skipped)
      - langfail/services/registry.py:read_raw (os.path.join without containment -> traversal, cf. V24)
    sanitizers_present:
      - "sanitize_path exists on the raw_artifact path but is gated by the very setting the attacker flips (conditional sanitizer composed with a writable gate)"
      - "merge_preferences_safe() exists in core/settings.py and allow-lists namespaces (D39) -- present but not used by the endpoint"
    notes: >
