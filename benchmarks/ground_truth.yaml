      - langfail/agent/tools.py:http_get (fetched page body becomes a tool message in the conversation)
      - langfail/agent/core.py:run_agent_guarded (gate scans the WHOLE conversation text -- system, user, context docs AND tool results -- for '[user confirmed]')
      - langfail/agent/tools.py:delete_job (destructive call executes on a confirmation the user never gave)
    sanitizers_present:
      - "the confirmation gate EXISTS and correctly blocks the destructive call when the marker is absent -- it is bypassed only because the marker is searched in attacker-influenceable transcript content, not bound to a real user turn (provenance-blind check)"
    notes: >
      The gate's flaw is provenance, not absence: tool results and retrieved
      context are concatenated into the same string the gate scans, so any
      poisoned page or document containing the marker satisfies it. Contrast
      D36, where confirmation is an explicit out-of-band boolean supplied by
      the caller and conversation content cannot influence it.
    poc: tests/test_exploits_agentic.py::test_v60_confirmation_spoof_via_fetched_page

