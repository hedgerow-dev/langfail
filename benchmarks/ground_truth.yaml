  - id: V34
    title: Code-interpreter RCE via exec of model-generated analysis code (PandasAI class)
    cwe: CWE-95
    huntr_analog: "PandasAI CVE-2024-12366 -- 'chat with your dataframe' agent exec()s LLM-authored Python"
    tier: 5
    exploitable: true
    source: {file: langfail/api/datasets.py, symbol: analyze_dataset, note: "question (JSON body)"}
    sink: {file: langfail/services/analysis.py, symbol: run_analysis, line_hint: 22}
    taint_path:
      - langfail/api/datasets.py:analyze_dataset (question)
      - langfail/services/analysis.py:run_analysis (calls generate_code, then execs the returned snippet)
      - langfail/agent/llm.py:generate_code (stub reproduces the question verbatim as Python -- no dispatch/allowlist)
      - langfail/services/analysis.py:run_analysis (exec(code, scope) on the model's own generated code)
    sanitizers_present:
      - "exec runs with a scope dict pre-seeded with `df` and a comment claiming the snippet 'can only touch df' -- but no __builtins__ restriction is applied, so `import os` works (misdirection, cf. V15/V18's fake sandbox)"
    notes: >
      Third member of the LLM-output-as-source family (with V33 SQL and V31
      markdown), and distinct from the eval-based V15/V18: the SOURCE is the
      model's generated *code* (a completion, not a request parameter or a
      user-chosen tool argument), and the SINK is a multi-statement `exec`, so
      the payload uses statements (`import os; os.system(...)`) that a
      single-expression `eval` could not run. Mirrors PandasAI / LangChain's
