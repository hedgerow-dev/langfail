  - id: V39
    title: MCP sampling request poisoning (no human-gate assumption)
    cwe: CWE-20
    huntr_analog: "MCP 'sampling' capability abused by a server to smuggle attacker content into the connected client's own trusted model context, relying on hosts that auto-approve sampling requests with no human review"
    tier: 6
    exploitable: true
    source: {file: langfail/api/admin.py, symbol: set_tool_note, note: "note (JSON body) -- decorated with require_auth, not require_admin (same broken authz as V29)"}
    sink: {file: langfail/mcp_server.py, symbol: summarize_via_sampling, line_hint: 88}
    taint_path:
      - langfail/api/admin.py:set_tool_note (any authenticated user's note -> ToolNote row)
      - langfail/mcp_server.py:summarize_via_sampling (reads the ToolNote fresh)
      - langfail/mcp_server.py:summarize_via_sampling (embeds the note verbatim into a SamplingMessage, no validation)
      - "session.create_message(...) -- the note is sent to whatever client is connected, entering that client's own trusted model context; a host that auto-approves sampling requests (no human gate) processes it as if it were legitimate server-authored content"
    sanitizers_present:
      - "summarize_via_sampling_safe() exists in the same module and strips_directives() the note before sending -- present and unit-tested (D16), just not used by the vulnerable helper"
    notes: >
      A second MCP protocol-boundary bug alongside V29, but a different MCP
      capability: V29 poisons *tool metadata* (list_tools), read by the
      client once at connection time; V39 poisons a *sampling request*
