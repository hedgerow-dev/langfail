  - id: V64
    title: Config-as-taint -- user preference deep-merge flips a platform security toggle
    cwe: CWE-15
    huntr_analog: "mass-assignment-style configuration injection -- a generic user-preferences store sharing its keyspace with platform security toggles, letting a low-priv user weaken a hardened deployment at runtime"
    tier: 6
    exploitable: true
