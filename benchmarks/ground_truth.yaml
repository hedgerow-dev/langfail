  - id: V32
    title: Unicode/ASCII-smuggling prompt injection bypasses the directive filter
    cwe: LLM01
    huntr_analog: "invisible-Unicode (tag-block / zero-width) prompt injection evading a text filter"
    tier: 6
    exploitable: true
    source: {file: langfail/api/agent.py, symbol: ask, note: "message (Unicode Tags-block-encoded directive)"}
    sink: {file: langfail/agent/tools.py, symbol: run_sql, line_hint: 23}
    taint_path:
      - langfail/api/agent.py:ask (message, routed through the injection filter)
