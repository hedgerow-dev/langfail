  - id: V29
    title: MCP tool-description poisoning via broken authorization
    cwe: CWE-862
    huntr_analog: "MCP tool-poisoning attack: untrusted content trusted as server-authored tool metadata"
    tier: 6
    exploitable: true
    source: {file: langfail/api/admin.py, symbol: set_tool_note, note: "note (JSON body) -- decorated with require_auth, not require_admin"}
    sink: {file: langfail/mcp_server.py, symbol: _tool_description, line_hint: 21}
