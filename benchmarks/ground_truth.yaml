    exploitable: true
    source:
      - {file: dvml/api/datasets.py, symbol: create_dataset, note: "cleanup_dir (request 1, persisted to Dataset.cleanup_dir)"}
      - {file: dvml/api/datasets.py, symbol: schedule_cleanup, note: "pattern (request 2, later & unrelated, persisted to Job.payload_json only)"}
    sink: {file: dvml/services/retention.py, symbol: purge, line_hint: 15}
    taint_path:
      - dvml/api/datasets.py:create_dataset (cleanup_dir -> Dataset.cleanup_dir column)
      - dvml/api/datasets.py:schedule_cleanup (pattern -> enqueue("cleanup_dataset", {..., pattern}) -> Job.payload_json)
      - dvml/workers/tasks.py:cleanup_dataset (reads ds.cleanup_dir from the DB AND payload["pattern"] from the queue -- two independent reads joined only by dataset_id)
      - dvml/services/retention.py:purge (f"rm -f {cleanup_dir}/{pattern}", subprocess shell=True)
    sanitizers_present: []
    notes: >
      Neither half is dangerous alone and each is supplied in a separate HTTP
      request through a separate storage mechanism (an ORM column vs. a JSON
      blob in the job queue) -- there is no single request, and no single
      stored field, whose value alone reaches the sink. An engine must
      correlate two independently-tainted values across two different taint
      carriers, keyed only by a shared foreign key (dataset_id), and recognize
      their string-formatted concatenation as reaching a shell sink. This is a
      harder version of the second-order pattern already used in V06/V07/V11
      (which route a single tainted value through one DB/queue hop) --  here
      the dangerous string does not exist anywhere in storage until the two
      halves are concatenated at the sink.
    poc: tests/test_exploits_tier6.py::test_v28_taint_dilution_cleanup_rce

  - id: V29
    title: MCP tool-description poisoning via broken authorization
    cwe: CWE-862
    huntr_analog: "MCP tool-poisoning attack: untrusted content trusted as server-authored tool metadata"
    tier: 6
    exploitable: true
    source: {file: dvml/api/admin.py, symbol: set_tool_note, note: "note (JSON body) -- decorated with require_auth, not require_admin"}
    sink: {file: dvml/mcp_server.py, symbol: _tool_description, line_hint: 20}
    taint_path:
      - dvml/api/admin.py:set_tool_note (any authenticated user's note -> ToolNote row)
      - dvml/mcp_server.py:_tool_description (reads ToolNote fresh on every list_tools call)
      - dvml/mcp_server.py:build_tool_list (embeds the note into the MCP Tool.description every connecting client/agent receives)
    sanitizers_present:
      - "list_tool_notes (GET) correctly uses require_admin -- only the write path (POST) was left on require_auth (misdirection: the read is properly gated, the write is not)"
    notes: >
      This is a protocol-boundary bug, not a classic web one: the vulnerable
      value never renders as HTML and is never returned to the attacker's own
      HTTP response. It crosses into the MCP tool-description field, which any
      connecting agent implicitly trusts as authoritative server documentation
      (the real-world "MCP tool poisoning" pattern) -- so the impact lands on
      a different trust boundary (agent tool-selection reasoning) than the one
      the write endpoint sits behind (a regular authenticated user). Exercises
      the MCP protocol surface directly via `dvml mcp-serve` (optional `mcp`
      extra) rather than the in-process agent loop.
    poc: tests/test_exploits_tier6.py::test_v29_mcp_tool_description_poisoning

  - id: V30
    title: Agent long-term memory poisoning (persistent, cross-user)
    cwe: LLM01
    huntr_analog: "persistent prompt injection via agent memory (mem0/LangGraph store) read back cross-session"
    tier: 6
    exploitable: true
    source:
      - {file: dvml/api/agent.py, symbol: add_memory, note: "content (JSON body) -> AgentMemory"}
      - {file: dvml/api/agent.py, symbol: session, note: "message also remembered after each turn"}
    sink: {file: dvml/agent/tools.py, symbol: run_sql, line_hint: 18}
    taint_path:
      - dvml/api/agent.py:add_memory (attacker content persisted to AgentMemory; NOT executed in the writer's session)
      - dvml/agent/memory.py:remember (row stored with owner_id, but that column is never used to scope reads)
      - dvml/api/agent.py:session (a DIFFERENT user's later turn)
      - dvml/agent/core.py:run_agent use_memory=True (recall() pulls ALL memories into context, unscoped)
      - dvml/agent/memory.py:recall (no owner filter -- cross-tenant)
      - dvml/agent/tools.py:run_sql (attacker-embedded directive fires in the victim's session)
    sanitizers_present:
      - "AgentMemory.owner_id is recorded on write and recall_scoped() filters by it, but the shared session path calls the unscoped recall() (misdirection: the isolation primitive exists and is used elsewhere -- see D07 -- just not here)"
    notes: >
      The persistence upgrade of V17: instead of poisoning one model card read
      once, the attacker writes to durable agent memory that is recalled into
      every future session, for every user, until deleted. Source and sink are
      separated by a DB round-trip AND a user/session boundary -- no single
      request both writes and triggers. The write endpoint merely stores
      (nothing fires for the attacker), so a purely intra-request or
      intra-session taint view sees two innocuous halves.
    poc: tests/test_exploits_tier6.py::test_v30_agent_memory_poisoning

  - id: V31
    title: Markdown-image data exfiltration in rendered assistant/card preview
    cwe: CWE-200
    huntr_analog: "zero-click data exfil via rendered ![](attacker/?q=...) in an LLM chat/report UI (ChatGPT/Bard/Writer class)"
    tier: 5
    exploitable: true
    source: {file: dvml/api/models.py, symbol: create_model, note: "model_card (also reachable from assistant answer)"}
    sink: {file: dvml/services/markdown.py, symbol: render_markdown, line_hint: 20}
    taint_path:
      - dvml/api/models.py:create_model (model_card with an off-origin markdown image, or assistant output)
      - dvml/api/reports.py:markdown_preview (any user renders any model_id -- no owner check, cross-tenant like V19)
      - dvml/services/markdown.py:render_markdown (![alt](src) -> <img src> with the URL emitted verbatim, no host allow-list)
      - "viewer's browser auto-fetches the off-origin <img>, leaking whatever the attacker encoded in the query string (zero-click)"
    sanitizers_present:
      - "render_markdown_safe() restricts <img src> to the app's own origin and drops off-origin images -- present in the same module but NOT used on this path (see D08)"
    notes: >
      Distinct from the generic innerHTML XSS rule (V19): the taint SOURCE is
      LLM/user Markdown and the SINK is an image URL, so the exfiltration works
      even under an HTML sanitizer that permits <img> (as most chat UIs do) and
      even with scripts fully blocked. Almost no scanner models the image-src
      egress channel. Composes with any field that reflects secret/conversation
      data into the card body.
    poc: tests/test_exploits_tier6.py::test_v31_markdown_image_exfil

  - id: V32
    title: Unicode/ASCII-smuggling prompt injection bypasses the directive filter
    cwe: LLM01
    huntr_analog: "invisible-Unicode (tag-block / zero-width) prompt injection evading a text filter"
    tier: 6
    exploitable: true
    source: {file: dvml/api/agent.py, symbol: ask, note: "message (Unicode Tags-block-encoded directive)"}
    sink: {file: dvml/agent/tools.py, symbol: run_sql, line_hint: 18}
    taint_path:
      - dvml/api/agent.py:ask (message, routed through the injection filter)
      - dvml/agent/sanitize.py:strip_directives (regex matches only literal ASCII [[TOOL:...]] -- a normalization gap: it never folds/strips Cf tag-block or zero-width characters)
      - dvml/agent/core.py:run_agent
      - dvml/agent/llm.py:_deobfuscate (the model folds U+E00xx tag chars back to ASCII, as a capable LLM does)
      - dvml/agent/tools.py:run_sql (the smuggled directive, invisible in review, executes)
    sanitizers_present:
      - "strip_directives() IS applied on /ask and DOES neutralise a plainly-visible [[TOOL:...]] (see D09) -- it is bypassed only because it matches codepoints, not the normalized meaning (the tell: a filter over prompt-bound text that lacks Unicode normalization / Cf-stripping)"
    notes: >
      Novel and cheap to detect statically: a regex scanner can flag Unicode
      Tags-block (U+E0000-U+E007F) or zero-width characters inside string
      literals used as prompts, tool descriptions, or in instruction files
      (.cursorrules / CLAUDE.md / copilot-instructions / MCP tool-description
      fields) with near-zero false positives. This entry exercises the taint
      variant (untrusted request text); the same class also appears as a pure
      presence rule over instruction/config files.
    poc: tests/test_exploits_tier6.py::test_v32_unicode_smuggling_injection

  - id: V33
    title: Text-to-SQL agent executes model-generated SQL directly (Vanna.ai class)
    cwe: CWE-89
    huntr_analog: "Vanna.ai CVE-2024-5565 -- LLM-generated SQL from a text-to-SQL chain executed directly"
    tier: 5
    exploitable: true
    source: {file: dvml/api/experiments.py, symbol: ask, note: "question (JSON body)"}
    sink: {file: dvml/services/experiments.py, symbol: ask_experiments, line_hint: 68}
    taint_path:
      - dvml/api/experiments.py:ask (question)
      - dvml/services/experiments.py:ask_experiments (calls generate_sql, then executes the FULL returned string)
      - dvml/agent/llm.py:generate_sql (stub reproduces `question` verbatim into the WHERE clause -- no tool dispatch, no allowlist)
      - dvml/services/experiments.py:ask_experiments (db.session.execute(text(sql)) on the model's own generated SQL)
    sanitizers_present: []
    notes: >
      Distinct from V16 (agent tool-call SQLi) and V08/V22 (parameter
      interpolation): here the taint SOURCE is the model's own completion
      (agent/llm.py:generate_sql's return value), not a user-supplied query
      parameter, and the SINK is reached with no tool-dispatch/allowlist layer
      in between -- the pattern most rules miss because they only model
      "LLM output -> agent tool -> sink", not "LLM output -> sink" directly.
      Mirrors LangChain's SQLDatabaseChain / Vanna.ai, where the chain trusts
      the model to author safe SQL and runs it as-is.
    poc: tests/test_exploits_tier6.py::test_v33_text_to_sql_injection

  - id: V34
    title: Code-interpreter RCE via exec of model-generated analysis code (PandasAI class)
    cwe: CWE-95
    huntr_analog: "PandasAI CVE-2024-12366 -- 'chat with your dataframe' agent exec()s LLM-authored Python"
    tier: 5
    exploitable: true
    source: {file: dvml/api/datasets.py, symbol: analyze_dataset, note: "question (JSON body)"}
    sink: {file: dvml/services/analysis.py, symbol: run_analysis, line_hint: 36}
    taint_path:
      - dvml/api/datasets.py:analyze_dataset (question)
      - dvml/services/analysis.py:run_analysis (calls generate_code, then execs the returned snippet)
      - dvml/agent/llm.py:generate_code (stub reproduces the question verbatim as Python -- no dispatch/allowlist)
      - dvml/services/analysis.py:run_analysis (exec(code, scope) on the model's own generated code)
    sanitizers_present:
      - "exec runs with a scope dict pre-seeded with `df` and a comment claiming the snippet 'can only touch df' -- but no __builtins__ restriction is applied, so `import os` works (misdirection, cf. V15/V18's fake sandbox)"
    notes: >
      Third member of the LLM-output-as-source family (with V33 SQL and V31
      markdown), and distinct from the eval-based V15/V18: the SOURCE is the
      model's generated *code* (a completion, not a request parameter or a
      user-chosen tool argument), and the SINK is a multi-statement `exec`, so
      the payload uses statements (`import os; os.system(...)`) that a
      single-expression `eval` could not run. Mirrors PandasAI / LangChain's
      pandas agent, whose "restricted" exec sandbox was repeatedly bypassed.
      The literal `pandas` sinks of that class (`pd.eval` / `DataFrame.query`
      with engine='python') are the same taint shape reaching a different
      call.
    poc: tests/test_exploits_tier6.py::test_v34_code_interpreter_rce

  - id: V35
    title: Unsafe reflection dispatch on a model-chosen action name (raw tool-use pattern)
    cwe: CWE-470
    huntr_analog: "getattr(self, tool_call.function.name)(...) with no allow-list -- the common hand-rolled OpenAI/Anthropic tool-use integration pattern"
    tier: 6
    exploitable: true
    source: {file: dvml/api/agent.py, symbol: native, note: "message (JSON body), an inline [[TOOL:name args]] directive"}
    sink: {file: dvml/agent/native.py, symbol: dispatch, line_hint: 61}
    taint_path:
      - dvml/api/agent.py:native (message)
      - dvml/agent/native.py:run_native_loop (chat() returns tool_calls parsed from the directive; NOT re-validated against action_schemas())
      - dvml/agent/native.py:dispatch (getattr(_ACTIONS, name, None) resolves whatever name the model returned)
      - dvml/agent/native.py:AssistantActions._debug_eval (never advertised by action_schemas(), reachable anyway; eval with empty __builtins__ is escapable, same gadget class as V15/V18)
    sanitizers_present:
      - "action_schemas() only advertises get_model_info/list_experiment_names -- advertising a method is not the same as authorizing it, and dispatch() never checks the name against that list (misdirection: a reviewer who reads action_schemas() and stops there would conclude the surface is small)"
    notes: >
      Distinct from V20: V20 resolves a *stored config string* ("module:attr")
      via importlib + getattr, requiring a prior write to reach an import
      target. V35 resolves an *LLM-chosen method name* directly via getattr on
      an already-instantiated object already carrying private/internal
      methods -- the exact "raw tool-use" shape most non-framework agent code
      uses (as opposed to agent/core.py's explicit TOOLS allow-list dict,
      which V16-V19/V26 exercise). No import or file write is needed: the
      dangerous method already lives on the handler class, and the bug is
      purely a missing allow-list check between "what's advertised" and
      "what's callable".
    poc: tests/test_exploits_tier6.py::test_v35_reflection_dispatch_internal_method

