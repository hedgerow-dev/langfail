  - id: V35
    title: Unsafe reflection dispatch on a model-chosen action name (raw tool-use pattern)
    cwe: CWE-470
    huntr_analog: "getattr(self, tool_call.function.name)(...) with no allow-list -- the common hand-rolled OpenAI/Anthropic tool-use integration pattern"
    tier: 6
    exploitable: true
    source: {file: langfail/api/agent.py, symbol: native, note: "message (JSON body), an inline [[TOOL:name args]] directive"}
    sink: {file: langfail/agent/native.py, symbol: dispatch, line_hint: 60}
    taint_path:
      - langfail/api/agent.py:native (message)
      - langfail/agent/native.py:run_native_loop (chat() returns tool_calls parsed from the directive; NOT re-validated against action_schemas())
      - langfail/agent/native.py:dispatch (getattr(_ACTIONS, name, None) resolves whatever name the model returned)
      - langfail/agent/native.py:AssistantActions._debug_eval (never advertised by action_schemas(), reachable anyway; eval with empty __builtins__ is escapable, same gadget class as V15/V18)
    sanitizers_present:
      - "action_schemas() only advertises get_model_info/list_experiment_names -- advertising a method is not the same as authorizing it, and dispatch() never checks the name against that list (misdirection: a reviewer who reads action_schemas() and stops there would conclude the surface is small)"
    notes: >
      Distinct from V20: V20 resolves a *stored config string* ("module:attr")
      via importlib + getattr, requiring a prior write to reach an import
      target. V35 resolves an *LLM-chosen method name* directly via getattr on
      an already-instantiated object already carrying private/internal
      methods -- the exact "raw tool-use" shape most non-framework agent code
      uses (as opposed to agent/core.py's explicit TOOLS allow-list dict,
      which V16-V19/V26 exercise). No import or file write is needed: the
      dangerous method already lives on the handler class, and the bug is
      purely a missing allow-list check between "what's advertised" and
      "what's callable".
    poc: tests/test_exploits_tier6.py::test_v35_reflection_dispatch_internal_method

  - id: V36
    title: Unbounded agent iteration budget (denial of wallet, OWASP LLM10)
    cwe: CWE-400
    huntr_analog: "OWASP LLM10 (unbounded consumption) -- user-controlled max_tokens/n/iteration budget passed straight into a billed LLM call loop"
    tier: 5
    exploitable: true
    source: {file: langfail/api/agent.py, symbol: iterate, note: "max_rounds (JSON body)"}
    sink: {file: langfail/agent/core.py, symbol: run_agent_unbounded, line_hint: 64}
    taint_path:
      - langfail/api/agent.py:iterate (max_rounds, int()-cast but not clamped)
      - langfail/agent/core.py:run_agent_unbounded (for _ in range(max_rounds): chat(...) -- one billed LLM call per iteration, no ceiling)
    sanitizers_present:
      - "run_agent() (the default assistant path, used by /chat, /ask, /session, /analyze) hardcodes MAX_TOOL_ROUNDS=3 and is not caller-adjustable -- the cap exists and is enforced everywhere else in the codebase, just not on this one caller-parameterized path (misdirection: a reviewer who checked MAX_TOOL_ROUNDS and stopped there would conclude the loop is always capped)"
    notes: >
      Not a taint-to-dangerous-sink bug in the usual sense -- the "sink" is a
      resource-consumption amplifier, not a code-execution or data-exposure
      primitive. Each loop iteration is a real LLM API call in a production
      deployment (billed per-token, rate-limited, or both), so an unbounded
      caller-supplied round count is a direct cost/availability attack: one
      request can trigger arbitrarily many completions. The same shape
      applies to a raw `max_tokens`/`n`/`best_of` request field forwarded
      into a provider call with no server-side ceiling -- this entry exercises
      the loop-iteration variant since it's fully observable without a live
      LLM backend (the stub's tool_calls persist across rounds, so nothing
      about the conversation naturally terminates the loop; only max_rounds
      does).
    poc: tests/test_exploits_tier6.py::test_v36_unbounded_agent_iteration

  - id: V37
    title: Arbitrary code execution via untrusted dataset loading script (trust_remote_code class)
    cwe: CWE-94
    huntr_analog: "datasets.load_dataset(..., trust_remote_code=True) / Keras Lambda-layer & enable_unsafe_deserialization() -- arbitrary code runs at dataset/model load time, not just on deserialization of the artifact itself (CVE-2024-3660 class)"
    tier: 4
    exploitable: true
    source: {file: langfail/api/datasets.py, symbol: create_dataset, note: "loader_script (JSON body) -> Dataset.loader_script"}
    sink: {file: langfail/ml/dataset.py, symbol: run_loader_script, line_hint: 72}
    taint_path:
      - langfail/api/datasets.py:create_dataset (loader_script persisted to Dataset.loader_script, not executed yet)
      - langfail/api/datasets.py:prepare_dataset (a LATER, separate request reads ds.loader_script back from the DB)
      - langfail/ml/dataset.py:run_loader_script (exec(script_src, scope) with trust_remote_code defaulting to True)
    sanitizers_present:
      - "trust_remote_code defaults to True -- mirrors the historical default of several popular dataset-loading libraries before they made trust an explicit opt-in; nothing in create_dataset or prepare_dataset ever passes trust_remote_code=False"
    notes: >
      Distinct from V01/V07/V13 (which deserialize a data format -- pickle/
      torch/joblib/numpy -- where the vulnerability is in interpreting bytes
      as an object graph): here the artifact IS source code, and the "load"
      step is a literal exec(). This is exactly the trust_remote_code /
      Keras-Lambda class of bug, which people underestimate relative to
      classic pickle RCE because "just loading a dataset" sounds inert. Also
