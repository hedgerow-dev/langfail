# Precision decoys — deliberately SAFE code that closely resembles a planted
# bug. A taint engine or agent that reports any of these scores a FALSE POSITIVE.
decoys:
  - id: D01
    resembles: V03/V24 (path traversal)
    why_safe: "read_artifact_safe() realpath-contains the target under ARTIFACT_DIR and rejects escapes"
    location: {file: dvml/services/registry.py, symbol: read_artifact_safe}
    proof: tests/test_exploits_tier6.py::test_d01_safe_download_rejects_traversal
  - id: D02
    resembles: V08/V22 (SQLi)
    why_safe: "search_by_tag() binds :tag as a parameter; payload is treated as a literal"
    location: {file: dvml/services/experiments.py, symbol: search_by_tag}
    proof: tests/test_exploits_tier6.py::test_d02_by_tag_is_parameterized
  - id: D03
    resembles: V05/V19 (SSTI/XSS)
    why_safe: "render_report uses autoescape=True; HTML in the context is escaped on output"
    location: {file: dvml/services/reports.py, symbol: render_report}
    proof: tests/test_exploits_tier6.py::test_d03_report_html_is_escaped
  - id: D04
    resembles: V06/V23 (SSRF)
    why_safe: "fetch_guarded() resolves the host and blocks private/loopback/link-local/reserved IPs; redirects disabled"
    location: {file: dvml/services/fetcher.py, symbol: fetch_guarded}
    proof: tests/test_exploits_tier6.py::test_d04_guarded_fetch_blocks_private
  - id: D05
    resembles: V02 (unsafe YAML)
    why_safe: "load_safe() uses yaml.safe_load — no object construction"
    location: {file: dvml/services/config_loader.py, symbol: load_safe}
    proof: "covered indirectly; no dedicated test (static near-miss)"

chains:
  - id: CHAIN_A
    title: "SSRF -> pickle RCE across HTTP + DB + job queue + 3 modules"
    members: [V06, V07]
    description: >
      POST /api/datasets {source_url} persists the URL, enqueues an import job;
      the worker reads it back, fetch() performs the SSRF, the returned bytes are
      pickle-deserialised in load_model_bytes -> RCE. Source and sink are separated
      by a DB round-trip and the job queue.
    poc: exploits/chain_a_ssrf_to_rce.py

  - id: CHAIN_B
    title: "Indirect prompt injection: poisoned model card -> agent tool sink"
    members: [V17]
    description: >
      Attacker sets a model_card containing a [[TOOL:run_sql ...]] directive. A
      different user calls /api/agent/analyze on that model; the card is retrieved
      into the agent context and the embedded instruction drives a run_sql tool
      call that exfiltrates data — cross-taint through the DB into the agent loop.
    poc: exploits/chain_b_indirect_injection.py

  - id: CHAIN_C
    title: "Arbitrary file write -> import -> code execution (compose V10 + V20)"
    members: [V10, V20]
    description: >
      V10's metadata storage_path grants arbitrary file write into the package
      tree; V20's pipeline resolver imports an attacker-named "module:attr". Writing
      a .py into an importable location and then referencing it as a stage op yields
      RCE without any single call looking dangerous — the engine must compose a
      write sink with a later import sink. (V20 alone already reaches os:system;
      this chain is the stealthier, compose-two-bugs variant.)
    poc: "documented; test_v20 proves the import-dispatch half directly"

  - id: CHAIN_D
    title: "Multi-hop agent: poisoned card -> http_get (SSRF) -> run_sql (exfil)"
    members: [V26]
    description: >
      A poisoned model card triggers an http_get tool call; the fetched page body
      re-enters the agent loop as a tool result and carries a second directive that
      drives run_sql. Taint crosses the DB (stored card), the agent loop, an
      outbound HTTP fetch, and back into a SQL sink — undecidable for a static
      engine (it runs through the LLM), which is exactly what the agentic flow is for.
    poc: exploits/chain_b_indirect_injection.py  # see also test_v26_agent_multihop_injection
