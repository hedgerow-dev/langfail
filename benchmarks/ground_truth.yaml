      - langfail/workers/tasks.py:cleanup_dataset (reads ds.cleanup_dir from the DB AND payload["pattern"] from the queue -- two independent reads joined only by dataset_id)
      - langfail/services/retention.py:purge (f"rm -f {cleanup_dir}/{pattern}", subprocess shell=True)
