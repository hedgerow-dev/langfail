  - id: V27
    title: Call-site-sensitive path traversal in custom report templates
    cwe: CWE-22
    huntr_analog: "arbitrary file read via a template/theme-file selector param"
    tier: 6
    exploitable: true
    source: {file: dvml/api/reports.py, symbol: custom_report, note: "template_name (JSON body)"}
    sink: {file: dvml/services/reports.py, symbol: load_template_file, line_hint: 37}
    taint_path:
      - dvml/api/reports.py:custom_report (data.template_name, passed only when present)
      - dvml/services/reports.py:render_custom_report (passthrough, no validation)
      - dvml/services/reports.py:load_template_file (os.path.join(TEMPLATE_DIR, template_name), no containment check)
    sanitizers_present: []
    notes: >
      load_template_file is called from TWO sites: render_builtin_report resolves
      the filename through the BUILTIN_KINDS dict (always one of two hardcoded
      literals, regardless of the caller-supplied `kind` string — see D06) and
      render_custom_report passes template_name straight through. A
      context/call-site-insensitive engine that summarises taint per-function
      rather than per-call-site will either miss this (having "seen" the safe
      literal call site and concluded the sink is fine) or flag both call sites
      indiscriminately (a false positive on D06). Reading a file containing
      Jinja syntax also gets rendered as a template, so this composes with an
      arbitrary-write primitive (e.g. V10) into SSTI/RCE.
    poc: tests/test_exploits_tier6.py::test_v27_custom_template_traversal

