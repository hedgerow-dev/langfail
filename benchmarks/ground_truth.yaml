  - id: V62
    title: Training-data extraction via repetition/divergence (memorized corpus regurgitation)
    cwe: CWE-200
    huntr_analog: "Carlini et al. 2021 'Extracting Training Data from Large Language Models' & 2023 'Scalable Extraction of Training Data from (Production) Language Models' -- repetition/'repeat forever' divergence makes an aligned model regurgitate memorized training data (OWASP LLM02-adjacent)"
    tier: 5
    exploitable: true
    source: {file: langfail/api/agent.py, symbol: chat, note: "message (repetition/divergence trigger)"}
