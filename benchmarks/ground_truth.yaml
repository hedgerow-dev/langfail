  - id: V30
    title: Agent long-term memory poisoning (persistent, cross-user)
    cwe: LLM01
    huntr_analog: "persistent prompt injection via agent memory (mem0/LangGraph store) read back cross-session"
    tier: 6
    exploitable: true
    source:
      - {file: langfail/api/agent.py, symbol: add_memory, note: "content (JSON body) -> AgentMemory"}
      - {file: langfail/api/agent.py, symbol: session, note: "message also remembered after each turn"}
    sink: {file: langfail/agent/tools.py, symbol: run_sql, line_hint: 23}
    taint_path:
      - langfail/api/agent.py:add_memory (attacker content persisted to AgentMemory; NOT executed in the writer's session)
      - langfail/agent/memory.py:remember (row stored with owner_id, but that column is never used to scope reads)
      - langfail/api/agent.py:session (a DIFFERENT user's later turn)
      - langfail/agent/core.py:run_agent use_memory=True (recall() pulls ALL memories into context, unscoped)
      - langfail/agent/memory.py:recall (no owner filter -- cross-tenant)
      - langfail/agent/tools.py:run_sql (attacker-embedded directive fires in the victim's session)
    sanitizers_present:
      - "AgentMemory.owner_id is recorded on write and recall_scoped() filters by it, but the shared session path calls the unscoped recall() (misdirection: the isolation primitive exists and is used elsewhere -- see D07 -- just not here)"
    notes: >
      The persistence upgrade of V17: instead of poisoning one model card read
      once, the attacker writes to durable agent memory that is recalled into
      every future session, for every user, until deleted. Source and sink are
      separated by a DB round-trip AND a user/session boundary -- no single
      request both writes and triggers. The write endpoint merely stores
      (nothing fires for the attacker), so a purely intra-request or
      intra-session taint view sees two innocuous halves.
