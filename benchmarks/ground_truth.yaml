  - id: V20
    title: Unsafe reflection via dotted-path pipeline callable
    cwe: CWE-470
    huntr_analog: "arbitrary callable resolution / import in ML pipeline runner"
    tier: 6
    exploitable: true
    source: {file: dvml/api/experiments.py, symbol: "run / create_experiment", note: "stage op string (body or stored params_json)"}
    sink: {file: dvml/services/pipeline.py, symbol: _resolve, line_hint: 21}
    taint_path:
      - dvml/api/experiments.py:create_experiment (pipeline stages persisted to params_json) OR run (stages in body)
      - dvml/api/experiments.py:run (reads stored stages back from DB when body omits them — second-order)
      - dvml/services/pipeline.py:run_pipeline -> _resolve (importlib.import_module + getattr on "module:attr")
      - "resolved callable invoked with attacker args, e.g. os:system -> command exec"
    sanitizers_present:
      - "bare op names are looked up on the transforms allow-module; the ':' branch is unrestricted (dispatch the engine must resolve)"
    poc: tests/test_exploits_tier6.py::test_v20_pipeline_reflection_rce

