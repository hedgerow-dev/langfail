      the same serving stack, not the model file. Split-process model
      serving (API layer + a separate runner/worker that holds the loaded
      weights) is common precisely because it lets the model load once and
      be shared across requests -- and pickling the call arguments to cross
      that boundary is a frequent, under-scrutinised choice, since numpy
