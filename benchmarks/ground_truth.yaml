    why_safe: "get_article_safe_gate fetches then checks article.status != 'published', denying (404) before an unpublished draft's fields are returned -- the status gate dominates the use"
    location: {file: langfail/api/authz_demo.py, symbol: get_article_safe_gate}
    proof: tests/test_exploits_authz.py::test_d48_status_gate_blocks_unpublished_draft
  - id: D49
    resembles: V72/V73 (status IDOR)
    authz_model: status
    why_safe: "get_article_safe_fused query-fuses status='published' into the fetch itself -- a draft simply doesn't match the query"
    location: {file: langfail/api/authz_demo.py, symbol: get_article_safe_fused}
    proof: tests/test_exploits_authz.py::test_d49_status_fused_blocks_unpublished_draft
  - id: D50
    resembles: "a hypothetical 'V67' -- ownership check written after the response payload is built"
    authz_model: ownership
    why_safe: "get_note_safe_late_built reads note.id/title/body into a local `payload` before the ownership check, but the check's own deny branch returns a DIFFERENT response object on failure, so payload is simply discarded when unauthorized -- correctly blocked at runtime. Deliberately NOT labeled a vulnerability despite AuthzPass being unable to statically prove dominance here (dominance analysis sees the fields touched before the check and can't reason about which branch's return value actually escapes the function) -- a documented precision limitation, scored Medium rather than fully suppressed. See docs/benchmarks/bola-idor.md in open-rowan."
    location: {file: langfail/api/authz_demo.py, symbol: get_note_safe_late_built}
    proof: tests/test_exploits_authz.py::test_d50_late_built_payload_still_blocked_on_deny
  # D51 is intentionally absent -- retired during the pre-publication review,
  # following the same convention as D03 and V67.
  #
  # It claimed langfail/ui/views.py:search as a safe location on the grounds
  # that the template's `{{ q }}` heading is autoescaped. That claim is still
  # true of the heading, but it was never true of the *function*: search() is
  # V75's source (reflected) and V83's sink (stored). Reporting that symbol is
  # correct about two real vulnerabilities and "wrong" about one decoy, which
  # makes it a coin flip rather than a precision test. The autoescaped-heading
  # behaviour it documented is still asserted, as part of V75's PoC.
  - id: D52
    resembles: V78 (CSRF on the dashboard admin settings form)
    why_safe: "the JSON API's equivalent endpoint (POST /api/admin/settings) requires an Authorization: Bearer token -- a cross-site form POST carries the ambient session_token cookie but no bearer header, so it is rejected (401) before any settings are changed. Cookie-based dashboard auth does not extend to the token-based API."
    location: {file: langfail/api/admin.py, symbol: settings}
    proof: tests/test_exploits_ui.py::test_d52_api_cookie_only_request_unauthorized

chains:
  - id: CHAIN_A
    title: "SSRF -> pickle RCE across HTTP + DB + job queue + 3 modules"
    members: [V06, V07]
    description: >
      POST /api/datasets {source_url} persists the URL, enqueues an import job;
      the worker reads it back, fetch() performs the SSRF, the returned bytes are
      pickle-deserialised in load_model_bytes -> RCE. Source and sink are separated
      by a DB round-trip and the job queue.
    poc: exploits/chain_a_ssrf_to_rce.py

  - id: CHAIN_B
    title: "Indirect prompt injection: poisoned model card -> agent tool sink"
    members: [V17]
    description: >
      Attacker sets a model_card containing a [[TOOL:run_sql ...]] directive. A
      different user calls /api/agent/analyze on that model; the card is retrieved
      into the agent context and the embedded instruction drives a run_sql tool
      call that exfiltrates data — cross-taint through the DB into the agent loop.
    poc: exploits/chain_b_indirect_injection.py

  - id: CHAIN_C
    title: "Arbitrary file write -> import -> code execution (compose V10 + V20)"
    members: [V10, V20]
    description: >
      V10's metadata storage_path grants arbitrary file write into the package
      tree; V20's pipeline resolver imports an attacker-named "module:attr". Writing
      a .py into an importable location and then referencing it as a stage op yields
      RCE without any single call looking dangerous — the engine must compose a
      write sink with a later import sink. (V20 alone already reaches os:system;
      this chain is the stealthier, compose-two-bugs variant.)
    poc: "documented; test_v20 proves the import-dispatch half directly"

  - id: CHAIN_D
    title: "Multi-hop agent: poisoned card -> http_get (SSRF) -> run_sql (exfil)"
    members: [V26]
    description: >
      A poisoned model card triggers an http_get tool call; the fetched page body
      re-enters the agent loop as a tool result and carries a second directive that
      drives run_sql. Taint crosses the DB (stored card), the agent loop, an
      outbound HTTP fetch, and back into a SQL sink — undecidable for a static
      engine (it runs through the LLM), which is exactly what the agentic flow is for.
    poc: exploits/chain_b_indirect_injection.py  # see also test_v26_agent_multihop_injection

  - id: CHAIN_E
    title: "Persistent agent memory poisoning: attacker session -> shared memory -> victim session -> run_sql (exfil)"
    members: [V30]
    description: >
      Attacker calls POST /api/agent/memory with a directive-bearing note in
      their OWN session; nothing fires for them -- the write is inert by
      itself, since recall() is never called on the write path. A different
      user's later, unrelated /api/agent/session call recalls the shared
      memory (unscoped by owner) into their context, and the embedded
      directive drives a run_sql tool call that exfiltrates credentials in
      the victim's own session. Cross-taint through the DB, across a user
      boundary, AND across a session boundary that may span days -- the
      persistence upgrade of CHAIN_B's single-retrieval indirect injection.
    poc: tests/test_exploits_tier6.py::test_v30_agent_memory_poisoning

  - id: CHAIN_F
    title: "Dormant plugin: upload (inert) -> process restart -> module-level code exec"
    members: [V54]
    description: >
      POST /api/experiments/plugins stores attacker Python source and an
      enabled Plugin row; the request itself executes nothing and the file is
      never read again until the NEXT create_app() boot, where
      load_enabled_plugins imports it into the app process. Source and sink are
      separated by a DB round-trip, the filesystem, and a process boundary --
      undetectable by inspecting the upload handler alone.
    poc: tests/test_exploits_ml.py::test_v54_plugin_executes_on_next_boot

  - id: CHAIN_G
    title: "Feedback poisoning -> job queue -> unreviewed retrain -> backdoored scorer"
    members: [V57]
    description: >
      POST /api/datasets/<id>/feedback persists a poisoned (features, label)
      row and enqueues a retrain_model job; the worker ingests every feedback
      row regardless of review status, apply_feedback turns the trigger token
      into a learned override in Model.meta_json, and subsequent predict calls
      return the attacker's label whenever the trigger is present while clean
      inputs are unaffected. Taint crosses the DB, the job queue, and a
      second DB round-trip before surfacing at the inference response.
    poc: tests/test_exploits_ml.py::test_v57_feedback_backdoor_via_retrain

  - id: CHAIN_H
    title: "Config injection -> traversal: preference write re-enables V24 in a hardened deployment"
    members: [V64, V24]
    description: >
      An operator hardens the deployment (security.strict_paths=true in the
      runtime settings store), which deadens V24's traversal: /api/models/
      artifact?path=../ is sanitized. Any authenticated user then POSTs
      /api/agent/preferences {"security": {"strict_paths": false}} (V64) --
      the generic preferences endpoint deep-merges the security namespace with
      no allow-list, flipping the gate -- and the identical traversal request
      now succeeds. Neither bug alone is exploitable in that deployment: V24
      is unreachable while hardened, and V64's write is inert without a
      config-gated sink to weaken. The engine must compose a settings-store
      write with a conditional sanitizer on a different endpoint.
    poc: tests/test_exploits_agentic.py::test_v64_preference_injection_weakens_path_hardening

# ----------------------------------------------------------------------
# Config/compose findings — a STRUCTURALLY DIFFERENT category from
# everything above. CF01–CF03 are serving-infrastructure misconfigurations for
# tools Langfail itself never runs or embeds (Ollama, TorchServe, Triton
# are external processes an operator deploys alongside it) -- unlike V01-V64,
# there is no source, no sink, no taint_path, and no PoC test, because there
# is no code path to execute: the finding IS the presence of the
# misconfigured flag/binding in deploy/docker-compose.yml. A rule for this
# class is a regex/config scan, not a taint rule, and should be scored as a
# presence/absence check against that one fixture file, not against
# benchmarks/check_ground_truth.py's function-symbol resolution (which only
# understands Python source). CF04–CF05 are the same presence-only category
# but the flag/binding lives in Langfail's own code (a debug=True run call,
# hardcoded fallback secrets) rather than the compose file.
config_findings:
  - id: CF01
    title: Ollama bound to every interface with no authentication ("Probllama" class)
    cwe: CWE-306
    huntr_analog: "Ollama exposed on 0.0.0.0 with no auth -- CVE-2024-37032 and the broader 'Probllama' pattern of unauthenticated network-reachable model-pull/inference APIs"
    location: {file: deploy/docker-compose.yml, service: ollama}
    finding: "OLLAMA_HOST=0.0.0.0 + a published port, with no reverse-proxy auth in front"
  - id: CF02
    title: TorchServe management API exposed with token auth disabled (ShellTorch class)
    cwe: CWE-306
    huntr_analog: "TorchServe management API (8081) reachable with --disable-token-auth -- CVE-2023-43654 and related ShellTorch findings: unauthenticated remote model registration from an arbitrary URL"
    location: {file: deploy/docker-compose.yml, service: torchserve}
    finding: "--disable-token-auth --enable-model-api, with both the inference (8080) and management (8081) ports published"
  - id: CF03
    title: Triton explicit model-control API published with no auth in front
    cwe: CWE-306
    huntr_analog: "Triton Inference Server --model-control-mode=explicit's load/unload HTTP endpoint reachable with no gateway auth -- lets any caller load an arbitrary model into the server"
    location: {file: deploy/docker-compose.yml, service: triton}
    finding: "--model-control-mode=explicit --allow-http=true, with port 8000 published and no auth layer in front of the load/unload endpoint"
  - id: CF04
    title: Flask development server started with debug=True (Werkzeug debugger exposed)
    cwe: CWE-489
    huntr_analog: "debug mode left on in a deployed Flask app -- the Werkzeug interactive debugger is a known RCE class when the console PIN is weak or leaked (CWE-489 active debug code / CWE-672 operation on a resource after expiration of intended lifetime)"
    location: {file: langfail/cli.py, symbol: main}
    finding: "main runs create_app().run(debug=True), exposing the Werkzeug interactive debugger (PIN-protected but a known RCE class when the PIN is weak/leaked)"
  - id: CF05
    title: Hardcoded default secrets compiled into the source (forgeable session JWTs)
    cwe: CWE-798
    huntr_analog: "hardcoded fallback secrets in a shipped config module -- any deployment that doesn't set the env overrides runs on publicly-known keys, so session JWTs are forgeable by anyone who has read the source"
    location: {file: langfail/core/config.py, symbol: Config}
    finding: "Config.SECRET_KEY \"langfail-dev-secret\" and Config.JWT_SECRET \"langfail-dev-jwt-secret\" are used whenever LANGFAIL_SECRET_KEY/LANGFAIL_JWT_SECRET are unset; any deployment that doesn't override them mints forgeable session JWTs"

