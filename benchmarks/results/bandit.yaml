notes: >
  Out-of-the-box `bandit -r langfail/` against a blind copy, no config, no
  custom rules, no baseline. Bandit alone -- the existing "Bandit + Semgrep"
  row on SCOREBOARD.md is a different (unrecorded) run and is not comparable.

  Two scoring judgements, written down because they move the number:

  1. Bandit is a pattern scanner, not a taint engine: it reports dangerous
     sinks, never source-to-sink flows. Scoring it by SCOREBOARD.md's
     "does the engine connect source to sink" rule would give it zero. It is
     scored here on whether it located the entry's declared sink, which is
     the most generous defensible reading. Every credit below is a sink
     match, not a flow.
  2. B403/B404 ("consider possible security implications associated with
     importing pickle/subprocess") and B110 (try/except/pass) are
     informational module- and style-level rules, not claims about a specific
     defect. They are recorded as unmatched rather than silently filtered, so
     the 10 unmatched below are all of that kind. No real-world Bandit user
     leaves them on; discount them if comparing against a tuned run.

