notes: >
  `open-rowan scan <blind-copy> --authz`, no config, no custom rules, no
  baseline. 173 findings (146 code, 27 SCA) in 11.5s. The default-flag run is
  committed alongside as raw/open-rowan-default.json.

  This supersedes nothing. The existing "Open-Rowan 40/82 (49%), 3 FPs" row in
  SCOREBOARD.md's unverified table was a different, unrecorded run against a
  smaller manifest and a leaky blind copy. Per commit 0c63c5d that row was
  itself a flag-ON number (the flag-off figure recorded at the time was 39%),
  so it is not comparable to either column below.

  ANCHORING, and it is the thing that most changed this score. Open-Rowan
  reports cross-file flows, so a finding's file/line often sits at the SOURCE
  function while the message names the sink. An earlier draft of this file
  scored by sink-function co-location only and threw away several correctly
  reasoned findings for being anchored one frame up. V03 is the clearest case:
  the engine emitted "get_blob() reaches a sink via read_artifact() ... path is
  passed through sanitize_path(), but its implementation does a single
  non-recursive strip of a literal traversal sequence, which is bypassable
  (e.g. '....//' collapses to '../' after one pass)". That is a complete and
  correct statement of V03, anchored at api/models.py, not at the declared sink
  in services/registry.py. Scoring rule used here: a finding credits an entry
  if it is anchored in that entry's declared SOURCE or SINK function AND its
  message describes that entry's defect. Location alone never suffices.

  That rule matters because source-anchoring is otherwise wildly generous: five
  separate manifest entries (V10, V17, V26, V31, V52) declare create_model() as
  their source, so one finding there would credit all five on location alone.
  Only V10 is credited, because only V10's defect is what the message
  describes.

  THREE NUMBERS FROM ONE SCAN. On identical output:
    co-location, sink only          41/82 (50%)
    co-location AND CWE agreement   28/82 (34%)
    adjudicated per the rule above  36/82 (44%)  <- the score recorded here
  The spread is not noise, it is the rubric. Co-location alone credits V80 (a
  missing HttpOnly flag) because an open-redirect rule fired elsewhere in the
  same login(), and V81 (an IDOR) because a SQLi rule fired on the same line.
  CWE agreement discards a correct eval() finding for reporting CWE-94 where
  the key says CWE-95.

  THE --authz FLAG. Open-Rowan's object-level authorization pass is off by
  default. Adjudicated the same way both times:
    default   28/82 (34%), 140 findings
    --authz   36/82 (44%), 173 findings
  The delta is exactly 8 entries, V65/V66/V68-V73, every one an IDOR. (V12 is
  credited in BOTH runs: the default run already reached it through a
  cross-file finding, so it is not part of the delta. V81 is co-located in both
  runs via a SQLi rule and is credited in neither.)

  PRECISION. Two decoy false positives:
  - D06 render_builtin_report: NS-SSTI-001 fires on `_env.from_string(...)`
    without noticing the filename is always one of a fixed literal set from
    BUILTIN_KINDS. The call-site-sensitivity test, working as designed.
  - D10 ask_experiments_structured: NS-SQLI-005 fires on the f-string without
    noticing the column is allow-listed and the value is bound as :value.

  A third wrong call that is NOT scored as a decoy FP because the function is
  not a decoy: AUTHZ-BOLA-001 on add_team_member, which does check
  `g.user_id not in team.members` before writing. It is a false positive in
  substance, it is --authz-only, and honest precision for the flag is therefore
  "8 real, 1 wrong" on the authz tier rather than a clean sweep. The pass did
  not fire on any of the 10 correctly-scoped decoys (D41-D50) sitting beside
  the real ones.

  THE 33 AUTHZ FINDINGS. The flag produces 33 AUTHZ-BOLA-001 hits, and only 9
  are adjudicated above (8 credited + add_team_member). The remaining 24 land
  on handlers that really do fetch an object by caller-supplied id with no
  ownership check, but which the manifest does not key as IDOR entries:
  get_dataset, prepare_dataset, run, export_experiment, evaluate, predict,
  predict_label, train_row, get_model, convert, render_annotation,
  fetch_artifact, load_verified, upload_config, model_detail and others. They
  are recorded as unmatched, not as false positives, and four of them were
  independently flagged as unkeyed gaps by the Sonnet and Haiku sweeps
  (load_verified by Sonnet; run, evaluate and get_dataset by Haiku). Three
  independent reviewers converging on the same set is a strong signal the key
  under-keys missing-authorization bugs, in the same way it did before V81 and
  V82 were added.

  One near-miss worth recording. AUTHZ-BOLA-001 fires on the predict_label
  ROUTE handler in api/inference.py, which is a different function from the
  D31 decoy (predict_label in ml/predict.py). D31's safety claim is about
  model extraction (only an argmax label leaves the API), which is orthogonal
  to authorization, and the route handler's missing ownership check is real.
  Not scored as a decoy FP.

  CREDITED DESPITE A CWE MISMATCH (5): V15 and V34 (key says CWE-95, rule
  reports CWE-94 for the same eval/exec defect); V19 (key says CWE-79, rule
  NS-SSTI-001 reports CWE-1336 on the same misconfigured Environment); V46
  (key says CWE-640, rule reports CWE-328 "MD5 is broken" on
  derive_recovery_code, which is the mechanism of the bug, consistent with the
  same call made in results/bandit.yaml); V06 (generic cross-file rule, but
  the message reads "URL parsing validated but fetcher bypasses the check",
  which is exactly the is_safe_url gap).

  REJECTED AS ACCIDENTAL CO-LOCATION (8): V23, V36, V53, V55, V76, V80, V81,
  V83. In each case a finding lands in the right function while describing a
  different bug. V53 (hubconf.py exec at install) got a tarfile zip-slip rule.
  V55 (model extraction) and V76 (stored XSS) each got an unrelated BOLA
  finding. V83 (STORED XSS via a model name) and V75 (REFLECTED XSS via the
  search query) share the search() sink; the single TNT-XSS-001 there says
  "reflected XSS", so V75 is credited and V83 is not. Scoring the finding as
  described, not the symbol.

  RERUN 2026-08-01 against a fresh blind copy. 178 findings (was 173). Net
  +2 recall, +2 false positives.

  New credits: V25 (XXE, ns-websec-611-001 in parse_model_config) and V43
  (bearer token in query string, ns-websec-598-001 in _extract_token). Both
  come from rules added on 2026-08-01, and both were selected BECAUSE this
  benchmark was missing those classes -- so read them as benchmark-directed
  coverage, not as evidence of general capability. Of the two rules,
  ns-websec-598-001 has an independent real-world true positive (ragflow,
  api_key read from a query string); ns-websec-611-001 has none across 11
  large Python repos and ships declared unvalidated in its own rule file.

  New false positives: two CF-RETURN-001 cross-file findings, one naming
  verify_password (decoy D19), one naming find_table (no manifest entry).

  V48 IS credited (line below), via the module-level clarification later
  documented in SCOREBOARD.md's anchoring rule: _USERNAME_RE embodies the
  defect and validate_username matches with it. An earlier draft of this note
  said the opposite and was left stale after the rule was written down.

