notes: >
  Adjudication of the full v0.3.0 scan (`open-rowan scan <blind> --authz --audit`,
  189 raw findings) against ground_truth.yaml, reading the blind copy at each
  finding's location. This SUPERSEDES the earlier 66-finding pass, which was
  under-flagged (default "actionable" view + no --authz hid the BOLA tier, the
  api/models.py / registry / workers findings, and all low/info duplicates).

  Distinct V ids hit: 50 (50/82 = 61%). Decoy FPs: 5 (D06, D10, D19, D20, D34).
  Config findings: 2 (CF04 Flask debug=True, CF05 hardcoded JWT secret).
  Unmatched/noise: 58.

  This file is DEDUPLICATED: the 189 raw findings include many that describe the
  same defect (e.g. six deserialization findings across model_loader._deserialize
  all describe V01; four render_page findings all describe V19). Each V id is
  listed exactly once here, keeping the finding anchored in the manifest's
  declared source or sink function and dropping the rest (47 duplicate claims
  removed). Recall is unchanged at 50 distinct V ids.

  The scan also surfaced 27 SCA/depguard dependency CVEs (pyjwt, requests, flask,
  click, plus one phantom-dependency note). These are excluded from the findings
  list per benchmark convention: the 82-vuln manifest tracks planted code/taint
  bugs, not dependency versions, so they are neither true positives nor false
  positives against this key.

  DELTA vs the prior committed run (39/82): +11 gained, 0 lost.
    Gained: V07, V20, V27, V29, V30, V33, V40, V53, V58, V76, V80.
    These surface only in the fuller --audit set:
    - V07  [155] worker import_dataset -> load_model_bytes -> pickle (SSRF-fetched)
    - V20  [059] run -> run_pipeline -> importlib.import_module (reflection)
    - V27  [074] custom_report -> render_custom_report (template_name traversal)
    - V29  [170] ns-aiml-125: MCP tool description is a non-literal (the ToolNote)
    - V30  [160] TNT-ML-016: agent-memory read-back into LLM context, unscoped
    - V33  [057] ask -> ask_experiments runs the model's generated SQL (text-to-SQL)
    - V40  [171] NS-AIML-009: MCP tools exposed with no authentication check
    - V53  [140] import_hub -> load_from_hub (dynamic import of untrusted module)
    - V58  [164] ns-aiml-168: install_package pip-installs an arbitrary agent-named pkg
    - V76  [102] model_detail.html {{ card_html|safe }} (dashboard stored XSS)
    - V80  [152] login set_cookie without httponly (JS-readable session JWT)
  No prior V id was lost: every one of the prior run's 39 recurs here.

  ANCHORING RULE: a finding credits an entry only when anchored in that entry's
  declared source or sink function AND its message describes that entry's defect.
  CWE disagreement does not discard correct work. The module-level clarification
  applies (`_page_env = Environment(autoescape=False)` credits V19).

  BOLA TIER. AUTHZ-BOLA-001 fires cleanly on all eight keyed demo vulns (V65,
  V66, V68-V73). It fired on NONE of the ten scoped decoys D41-D50, and not on
  get_note_late_built (D50). add_team_member [036] is a false positive in
  substance (it does check membership) but is not a keyed decoy, so it is
  unmatched, not a decoy FP. The 23 further AUTHZ hits on handlers with
  genuinely-absent ownership checks the key does not enumerate (get_dataset,
  predict, evaluate, model_detail, and others) are recorded unmatched (key
  candidates), not FPs.

  SAME-RULE-ON-BOTH-TWINS decoy FPs (an imprecise rule that hits a real vuln also
  fires on its safe twin): D20 [104] decode_token vs V44 verify_service_token
  (JWT-decode rule); D06 [075] render_builtin_report vs V05/V19/V27 (template
  from_string rule); D34 [165] install_from_catalog vs V58 install_package
  (agent-subprocess-no-sandbox rule).

  NOT CREDITED (strict): V35 (the eval findings sit at native.py:_debug_eval, the
  reflection gadget, not the declared sink dispatch(), and describe only a bare
  eval); V83 (the |safe finding does not distinguish the stored model name from
