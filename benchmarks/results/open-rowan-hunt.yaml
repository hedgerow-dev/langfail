notes: >
  `open-rowan hunt <blind-copy> --backend deepseek --discover -y --format json`,
  with `enable_authz: true` set via `.open-rowan.yml` in the blind copy root
  (hunt has no `--authz` CLI flag; the project-config path is the only way to
  turn AuthzPass on for a hunt run). One run, 10.4s static scan + LLM stages,
  61 hypotheses triaged, 25 files re-examined by the discover stage.

  This is a DIFFERENT thing from results/open-rowan.yaml. That file scores the
  raw static findings (scan --authz) directly against the manifest. This file
  scores only what hunt's own pipeline stood behind after LLM triage: a
  hypothesis credited only if hunt's adversarial verify pass marked it
  "upheld" (verdict "uncertain" or "refuted" is not credited, matching hunt's
  own bar), plus discover-stage findings that survived the mechanical
  snippet-provenance gate and its own verify pass. Static findings that hunt's
  triage never touched are not scored here at all, see "The authz result"
  below for why that matters.

  Recall: 33/82 (40%). 23 distinct entries from 38 upheld hypotheses (many
  hypotheses share an entry: multiple CF-SINK/CF-RETURN findings on the same
  create_model source, or a bug found by both hypothesize and the discover
  stage, count once). 10 more distinct entries from the discover stage's 17
  survivors, none overlapping the 23. Zero decoy false positives; one
  mechanical decoy-location match (D23) that does not survive adjudication,
  see below.

  THE AUTHZ RESULT IS THE HEADLINE FINDING OF THIS RUN. `.open-rowan.yml`
  turned AuthzPass on, and the pass ran and produced its usual 33 candidates
  (verified identical to the 33 in results/open-rowan.yaml's raw scan: same
  rule_id, same file:line set). Not one was promoted to a hunt hypothesis.
  `_select_priority_findings` (open_rowan/agents/workflow.py:857) promotes
  CRITICAL/HIGH severity, taint-flow-bearing, crossfile-engine, or
  reachability=="reachable" findings unconditionally, with a fallback that
  promotes MEDIUM-severity/confidence>=0.6 findings ONLY if that first filter
  produced nothing. Every one of the 33 AuthzPass findings on this app landed
  at Severity.MEDIUM or LOW (24 medium, 9 low; confidence 0.4 or 0.6; no
  taint_flow) -- because Langfail's whole IDOR tier is "authenticated but not
  object-authorized" (a route decorator present, no object-level check), which
  AuthzPass correctly scores lower than a fully-unguarded "no_guard" case.
  Since this app also has plenty of unrelated CRITICAL/HIGH findings (pickle,
  SSTI, command injection), the fallback branch never fires, and the
  MEDIUM-severity authz candidates never reach an LLM. Net effect: enabling
  authz for hunt cost nothing (33 fast static findings, no extra LLM calls)
  and gained nothing over a plain `scan --authz` (0 of them became a
  triaged hypothesis). The two IDOR entries this run DOES get credit for
  (V81, V82) came entirely from the discover stage reasoning about
  api/experiments.py from first principles, not from AuthzPass's own
  candidates -- an LLM asked to read the file top-to-bottom found the same
  bug class AuthzPass's deterministic pass already had sitting unused in
  `state.surface`.

  THE VERIFY STAGE CAUGHT A FALSE POSITIVE THE UNDERLYING STATIC RULE DIDN'T.
  A hypothesis claimed custom_report()'s `kind` parameter could select an
  attacker-controlled template (the exact shape of NS-SSTI-001's false
  positive on D06 in results/open-rowan.yaml, one of that run's two decoy
  hits). Hunt's adversarial verify pass refuted it: "the sink at reports.py:46
  only renders from a fixed set of built-in templates via
  BUILTIN_KINDS.get(kind, 'summary.tpl'), so a malicious 'kind' cannot select
  an attacker-controlled template." Same underlying static signal, same
  decoy, opposite outcome, because a second LLM pass was told to try to
  disprove the first one's claim rather than rubber-stamp it.

  THE ONE DECOY-LOCATION MATCH. The discover stage reported
  `reset_confirm_code` (D23) accepting an empty new_password with no
  validation. D23's own why_safe is about token derivation being sound
  (random, hashed, single-use, unlike V46's md5 derivation); the finding
  describes something orthogonal that D23 makes no claim about. Per Langfail's
  own "score the finding, not the symbol" rule this is not a false positive.
  It is also not new: BACKLOG.md's DISC-6 entry in the open-rowan repo
  documents the identical finding, on the identical function, from an earlier
  discover run against this same benchmark, and reaches the same verdict.
  Recorded as unmatched, not as a decoy FP.

  Provenance gate: 0/41 raw discover claims rejected for a bad path, bad line,
  or a snippet that didn't match the file at the claimed line (deepseek quoted
  accurately throughout, so -- as in DISC-6 -- the gate itself went
  unexercised on this run; it is proven by open-rowan's own test suite, not by
  this benchmark).

  Not measured: run-to-run stability (this is one run; DISC-6's own two-run
  comparison found 75% Jaccard agreement on exact file:line, with all
  high-signal finds reproducing and only the tail varying), and the
  --exploit/--base-url live-probe stages (off; no running instance was
  targeted).

