notes: >
  Rowan v2 (the rowan2 package: Opengrep taint rules, cross-file Python walk,
  second-order stores, syntax-only authorization checks) at rowan-v2 commit
  2b16884. Fresh blind export with scripts/export_blind_copy.py --suite langfail,
  run from a clean `git archive` of Langfail 16e5552 so untracked working-tree
  files could not enter the copy. Command:
  `rowan scan <blind> --authz --more-checks --no-cache -f json`. Both flags are
  documented opt-ins; no rule or config was written for this run.

  168 raw findings, adjudicated by hand against ground_truth.yaml (87 entries)
  by reading the blind copy at each finding's flow. Anchoring rule as in
  open-rowan.yaml: a finding credits an entry only when it is anchored in that
  entry's declared source or sink function AND describes that entry's defect.
  One line per entry: duplicates of a credited bug (the same sink reached from
  another route, or the same agent tool reached from another chat endpoint) are
  dropped, not listed. Raw finding numbers are given as [NNN], the index into
  the raw JSON findings array.

  Result: 50/87 V ids. Decoy FPs: 5 (D06, D10, D22, D48, D49). 30 further
  findings are listed with id ~: 22 missing-ownership-check hits on handlers the
  key does not enumerate (key candidates, not adjudicated as FPs), and 8 other
  claims, some real (KU03 exception text, which score.py has no id for) and
  some false (plugin name is regex-checked; /ui/admin checks the role inside).

  Not credited although the flow touches the entry: V32 (ask -> run_sql, but
  the claim says nothing about the smuggling bypass of the filter), V83 (search results
  are tainted by the query, not traced from the stored model name), V55/V56
  (ownership-check hits on predict_proba/row_loss, not the disclosure defect).

  Rescanned at 2b16884, which follows ORM rows read in a comprehension and
  return values three calls deep (was two). Against the f86bc28 scan of the
  same blind copy no finding was lost; the new ones add V30 and V77, a
  duplicate of V19 (assistant answer into render_page) and more KU03 exception
  text, and no decoy.

  The scan ran without --sca, so no dependency findings are in the raw output.
  Same caveat as every Rowan row: this repo's authors maintain the tool and did
  this adjudication. It has not been through an independent re-adjudication.

