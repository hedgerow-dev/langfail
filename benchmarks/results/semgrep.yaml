notes: >
  `semgrep --config p/python --config p/security-audit` against a fresh blind
  copy, no custom rules. 30 results.

  Adjudicated by the same rule SCOREBOARD.md states for every other row: a
  finding credits an entry when it is anchored in that entry's declared SOURCE
  or SINK function AND its message describes that entry's defect. Location
  alone never suffices. Enclosing function resolved by AST, not by line
  proximity.

  Deliberately NOT credited, though anchored in the right function: the two
  md5 findings in `derive_recovery_code` (V46). V46's defect is that a
  recovery token is predictable (CWE-640, insufficient randomness); "md5 is a
  weak hash" is a different claim about the same line, and crediting it would
  be exactly the location-based generosity the rubric exists to prevent.

  The three `template-unescaped-with-safe` hits are in .html templates, not
  Python, and name no manifest source/sink function; V76/V77/V83 declare their
  sinks in ui/views.py. Left unmatched rather than credited by file adjacency.
