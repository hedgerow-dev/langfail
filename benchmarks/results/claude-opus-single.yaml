notes: >
  One reviewer, whole blind copy, one context. Prompt is the "single-run
  (whole-app, v1)" text in benchmarks/sweep_prompt.md, verbatim. The reviewer
  was NOT told how many bugs are planted, or that any are.

  REPLACES the old unverified "Claude Opus 57%" row, which had no artifact and
  no saved prompt. Not comparable to the 5-region sweep either: this is one
  context over the whole app.

  85 findings (the first pass silently dropped two), zero decoy false positives. The review explicitly listed safe
  twins it declined to flag -- download_artifact, read_owner_file,
  render_card_markdown, fetch_external, search_by_tag,
  ask_experiments_structured, load_model_numeric, dispatch_public,
  install_from_catalog, new_recovery_code, run_agent_with_signal,
  import_experiment_document, run_analysis_aggregate,
  build_tool_list_snapshot, and the authz-demo guarded/fused variants --
  including get_note_late_built, which looks like a TOCTOU bug and is not.

  ADJUDICATED BY THE ROWAN AUTHORS, and this is the row where that conflict
  matters most: it outscores their own tool.

  CORRECTED 2026-08-01 after an adversarial re-adjudication. The first pass
  scored this 67/82 and claimed its judgement calls were "all made toward
  crediting the reviewer". That claim was FALSE: every unlisted call went the
  other way. The first pass also invented a "one finding, one manifest id"
  constraint, applied it ONLY to this row to withhold credits, and left it out
  of SCOREBOARD.md -- while the Sonnet sweep was credited eight separate vulns
  from a single bullet with sub-clauses. Applying the Sonnet standard here
  restores seven credits (V12, V50, V59, V63, V69, V71, V73) plus V75, which
  Rowan had been credited on strictly weaker evidence. The overcorrection was
  most likely anxiety about the disclosed conflict; the effect was to
  disadvantage the top-scoring competitor.

  Remaining judgement calls, stated plainly:
    - agent/sanitize.py:17 names strip_directives, which is decoy D09. Scored
      as V32, not a decoy FP: the claim is not "this safe function is broken"
      but the real Unicode-ordering defect (the stub deobfuscates Tags-block
      characters BEFORE the filter scans), which is V32's mechanism. Per
      SCOREBOARD.md, score the finding, not the symbol.
    - agent/tools.py:25 (run_sql unrestricted) credits V16 only. V17/V26/V30/
      V32 share that sink; crediting one finding for all five is the
      location-based generosity the rubric forbids. V30 and V32 are credited
      from their own separate findings.
    - core/security.py:96 -> V47 and core/security.py:134 -> V48 use the
      module-level and vocabulary clarifications, matching how Bandit scored.
    - workers/tasks.py:45 -> V07 and api/reports.py:40 -> V19 are
      source-function anchors, per the V03 precedent.

  A second opinion on this mapping would be worth having.
